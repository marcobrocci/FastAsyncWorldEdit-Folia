name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: List build artifacts before upload
        run: |
          echo "Checking for JAR files:"
          find . -name "*.jar" -type f | head -20

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldedit-build
          path: |
            worldedit-bukkit/build/libs/*.jar
            worldedit-fabric/build/libs/*.jar
            worldedit-forge/build/libs/*.jar
            worldedit-mod/build/libs/*.jar
            worldedit-sponge/build/libs/*.jar
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: worldedit-build
          path: build-artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la build-artifacts/
          find build-artifacts -name "*.jar" -type f | head -20

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build-artifacts/*.jar