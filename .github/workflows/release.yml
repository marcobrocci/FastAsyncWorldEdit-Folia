name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Bukkit module (focus on what we need for release)
        run: |
          echo "Building worldedit-bukkit module..."
          ./gradlew :worldedit-bukkit:shadowJar :worldedit-bukkit:reobfShadowJar --no-daemon --continue || echo "Some tasks failed, continuing to check for built jars"
          
          echo "Checking built JARs:"
          find worldedit-bukkit/build/libs -name "*.jar" -type f | sort

      - name: List all built artifacts for debugging
        run: |
          echo "=== Bukkit ==="
          ls -la worldedit-bukkit/build/libs/
          echo "=== Fabric ==="
          ls -la worldedit-fabric/build/libs/ 2>/dev/null || echo "Fabric build dir not found"
          echo "=== Forge ==="
          ls -la worldedit-forge/build/libs/ 2>/dev/null || echo "Forge build dir not found"
          echo "=== Mod ==="
          ls -la worldedit-mod/build/libs/ 2>/dev/null || echo "Mod build dir not found"
          echo "=== Sponge ==="
          ls -la worldedit-sponge/build/libs/ 2>/dev/null || echo "Sponge build dir not found"

      - name: Create Release (if it doesn't exist yet)
        # This step is actually redundant since we're triggered on release.published
        # but we'll keep it for safety
        run: echo "Release already exists, proceeding to upload assets"

      - name: Upload Bukkit Release Assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-bukkit/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Don't fail if no files match
          continue-on-error: true

      - name: Upload Fabric Release Assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-fabric/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: true

      - name: Upload Forge Release Assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-forge/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: true

      - name: Upload Mod Release Assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-mod/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: true

      - name: Upload Sponge Release Assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-sponge/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: true