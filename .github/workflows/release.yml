name: Build and Release

on:
  release:
    types: [published]

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to upload release assets
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        # We'll build what we can and look for the actual outputs
        run: ./gradlew clean build -x test --continue || echo "Build completed with some errors, continuing to check for built artifacts"

      - name: Find and list all built JAR files
        run: |
          echo "=== All built JAR files ==="
          find . -name "*.jar" -path "*/build/libs/*" -type f | sort || true
          echo ""

      - name: List WorldEdit Bukkit JARs
        run: |
          echo "=== WorldEdit Bukkit JARs ==="
          find worldedit-bukkit/build/libs -name "*.jar" -type f 2>/dev/null | sort || echo "No bukkit build dir or no JARs found"
          echo ""

      - name: List WorldEdit Fabric JARs
        run: |
          echo "=== WorldEdit Fabric JARs ==="
          find worldedit-fabric/build/libs -name "*.jar" -type f 2>/dev/null | sort || echo "No fabric build dir or no JARs found"
          echo ""

      - name: List WorldEdit Forge JARs
        run: |
          echo "=== WorldEdit Forge JARs ==="
          find worldedit-forge/build/libs -name "*.jar" -type f 2>/dev/null | sort || echo "No forge build dir or no JARs found"
          echo ""

      - name: List WorldEdit Mod JARs
        run: |
          echo "=== WorldEdit Mod JARs ==="
          find worldedit-mod/build/libs -name "*.jar" -type f 2>/dev/null | sort || echo "No mod build dir or no JARs found"
          echo ""

      - name: List WorldEdit Sponge JARs
        run: |
          echo "=== WorldEdit Sponge JARs ==="
          find worldedit-sponge/build/libs -name "*.jar" -type f 2>/dev/null | sort || echo "No sponge build dir or no JARs found"
          echo ""

      - name: Prepare Folia JAR (create Folia variant from Paper JAR)
        run: |
          # Find the Paper JAR file and create a Folia variant
          PAPER_JAR=$(find worldedit-bukkit/build/libs -name "FastAsyncWorldEdit-Paper-*.jar" | head -1)
          if [ -n "$PAPER_JAR" ]; then
            FOLIA_JAR="${PAPER_JAR/Paper/Folia}"
            cp "$PAPER_JAR" "$FOLIA_JAR"
            echo "Created Folia JAR: $FOLIA_JAR"
            ls -la "$FOLIA_JAR"
          else
            echo "Paper JAR not found, skipping Folia JAR creation"
            # List what we do have for debugging
            echo "Available Bukkit JARs:"
            ls -la worldedit-bukkit/build/libs/*.jar 2>/dev/null || echo "No JARs found"
          fi

      - name: Upload all Bukkit JARs as release assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-bukkit/build/libs/*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Continue even if no files match
          continue-on-error: true

      - name: Upload all Fabric JARs as release assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-fabric/build/libs/*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: true

      - name: Upload all Forge JARs as release assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-forge/build/libs/*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: true

      - name: Upload all Mod JARs as release assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-mod/build/libs/*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: true

      - name: Upload all Sponge JARs as release assets
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-sponge/build/libs/*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: true