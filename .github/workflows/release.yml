name: Build and Release

on:
  release:
    types: [published]

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to upload release assets
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        # We'll build what we can and look for the actual outputs
        run: ./gradlew clean build -x test --continue || echo "Build completed with some errors, continuing to check for built artifacts"

      - name: Find and list all built JAR files
        run: |
          echo "=== All built JAR files ==="
          find . -name "*.jar" -path "*/build/libs/*" -type f | sort || true
          echo ""

      - name: List WorldEdit Bukkit JARs
        run: |
          echo "=== WorldEdit Bukkit JARs ==="
          find worldedit-bukkit/build/libs -name "*.jar" -type f 2>/dev/null | sort || echo "No bukkit build dir or no JARs found"
          echo ""

      - name: Prepare Folia JAR (create Folia variant from Paper JAR)
        run: |
          # Find the Paper JAR file and create a Folia variant
          PAPER_JAR=$(find worldedit-bukkit/build/libs -name "FastAsyncWorldEdit-Paper-*.jar" | head -1)
          if [ -n "$PAPER_JAR" ]; then
            FOLIA_JAR="${PAPER_JAR/Paper/Folia}"
            cp "$PAPER_JAR" "$FOLIA_JAR"
            echo "Created Folia JAR: $FOLIA_JAR"
            ls -la "$FOLIA_JAR"
          else
            echo "Paper JAR not found, skipping Folia JAR creation"
            # List what we do have for debugging
            echo "Available Bukkit JARs:"
            ls -la worldedit-bukkit/build/libs/*.jar 2>/dev/null || echo "No JARs found"
          fi

      - name: List files in current release
        run: |
          echo "=== Checking existing release assets ==="
          # Get list of already uploaded assets to avoid duplicates
          ASSETS=$(gh release view ${{ github.ref_name }} --json assets -q '.assets[].name' 2>/dev/null || echo "")
          echo "Existing assets: $ASSETS"

      - name: Upload Bukkit JARs (skip if already exists)
        run: |
          for jar in worldedit-bukkit/build/libs/*.jar; do
            if [ -f "$jar" ]; then
              filename=$(basename "$jar")
              echo "Checking if $filename already exists in release..."
              if gh release view ${{ github.ref_name }} --json assets -q ".assets[].name" 2>/dev/null | grep -q "$filename"; then
                echo "Asset $filename already exists in release, skipping upload"
              else
                echo "Uploading $filename to release..."
                gh release upload ${{ github.ref_name }} "$jar" --clobber
              fi
            fi
          done

      - name: Upload Folia JAR (skip if already exists)
        run: |
          for jar in worldedit-bukkit/build/libs/FastAsyncWorldEdit-Folia-*.jar; do
            if [ -f "$jar" ]; then
              filename=$(basename "$jar")
              echo "Checking if $filename already exists in release..."
              if gh release view ${{ github.ref_name }} --json assets -q ".assets[].name" 2>/dev/null | grep -q "$filename"; then
                echo "Asset $filename already exists in release, skipping upload"
              else
                echo "Uploading $filename to release..."
                gh release upload ${{ github.ref_name }} "$jar" --clobber
              fi
            fi
          done