name: Build and Release

on:
  release:
    types: [published]

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle (skip tests and problematic adapter tasks)
        run: ./gradlew clean build -x test --continue

      - name: List built artifacts
        run: |
          echo "Built JARs in worldedit-bukkit:"
          ls -la worldedit-bukkit/build/libs/
          echo ""
          echo "Built JARs in worldedit-fabric:"
          ls -la worldedit-fabric/build/libs/
          echo ""
          echo "Built JARs in worldedit-forge:"
          ls -la worldedit-forge/build/libs/
          echo ""
          echo "Built JARs in worldedit-mod:"
          ls -la worldedit-mod/build/libs/
          echo ""
          echo "Built JARs in worldedit-sponge:"
          ls -la worldedit-sponge/build/libs/

      - name: Upload Bukkit Release Asset
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-bukkit/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Fabric Release Asset
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-fabric/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Forge Release Asset
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-forge/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mod Release Asset
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-mod/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Sponge Release Asset
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'worldedit-sponge/build/libs/FastAsyncWorldEdit-*.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}